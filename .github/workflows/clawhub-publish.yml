name: publish-to-clawhub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '鍙瑙堬紝涓嶇湡姝ｅ彂甯?
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Publish skill
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::缂哄皯浠撳簱 secret CLAWHUB_TOKEN锛岃鍒?Settings 鈫?Secrets and variables 鈫?Actions 娣诲姞"
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN" || true
          clawhub skill publish . \
            --slug netease-dynamic-avatar \
            --name "缃戞槗浜戝姩鎬佸ご鍍? \
            --categories lifestyle,automation \
            --topics "netease,music-163,avatar,webp,dynamic-avatar"
        # 鎯冲彧棰勮鏃舵妸涓婇潰鍛戒护鍔?--dry-run
