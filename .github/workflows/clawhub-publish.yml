name: publish-to-clawhub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only preview, do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Publish skill
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::Missing repo secret CLAWHUB_TOKEN. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN" || true
          clawhub skill publish . \
            --slug netease-dynamic-avatar \
            --name "netease-dynamic-avatar" \
            --categories lifestyle,automation \
            --topics "netease,music-163,avatar,webp,dynamic-avatar"
